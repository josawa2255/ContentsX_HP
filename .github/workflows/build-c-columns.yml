name: Build ContentsX Columns

# WP CMS に新コラムが追加された時や週次で再生成
on:
  workflow_dispatch:
  schedule:
    # 毎週日曜 03:00 JST (UTC 18:00 土曜)
    - cron: '0 18 * * 6'

permissions:
  contents: write
  actions: write   # push の後に static.yml / indexnow.yml を起動するため（下の説明）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build-c-columns
        run: python3 tools/build-c-columns.py
      - name: Commit generated columns
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add column/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(columns): 週次再ビルド (WP CMS → static)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN での push は push トリガーのワークフロー（公開・IndexNow）を起動しない（GitHub の仕様）。
      # workflow_dispatch は GITHUB_TOKEN からでも起動できるので、実際に push したときだけここで起動する
      - name: Deploy and notify IndexNow
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run static.yml --ref main
          gh workflow run indexnow.yml --ref main
