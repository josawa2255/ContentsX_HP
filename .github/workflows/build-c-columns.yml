name: Build ContentsX Columns

# WP CMS に新コラムが追加された時や週次で再生成
on:
  workflow_dispatch:
  schedule:
    # 毎週日曜 03:00 JST (UTC 18:00 土曜)
    - cron: '0 18 * * 6'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Run build-c-columns
        run: python3 tools/build-c-columns.py
      - name: Commit generated columns
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add column/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(columns): 週次再ビルド (WP CMS → static)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN での push は push トリガーのワークフロー（公開・IndexNow）を起動しない（GitHub の仕様）。
  # workflow_dispatch は GITHUB_TOKEN からでも起動できるので、実際に push したときだけ公開を起動し、
  # 公開の成功後に IndexNow へ通知させる。ワークフローを起動できる権限（actions: write）は、
  # 外部（WordPress）のデータを扱うビルドのジョブには渡さず、このジョブだけに付ける。
  # main で動いたときだけ（別ブランチで試したときに main を公開しない）。
  dispatch:
    needs: build
    if: needs.build.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy, then notify IndexNow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED_SHA: ${{ needs.build.outputs.sha }}
        run: gh workflow run static.yml --ref main -f indexnow_sha="$PUSHED_SHA"
