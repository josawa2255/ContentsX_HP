name: Build ContentsX Columns

# WP CMS に新コラムが追加された時や週次で再生成
on:
  workflow_dispatch:
  schedule:
    # 毎週日曜 03:00 JST (UTC 18:00 土曜)
    - cron: '0 18 * * 6'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
      # js/wp-config.js の maintenance: true の間は WordPress から取り込まない（SPEC.md「WordPress 一時停止スイッチ」）
      - name: Skip while WordPress maintenance is on
        id: gate
        run: |
          if grep -Eq '^[[:space:]]*maintenance:[[:space:]]*true' js/wp-config.js; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::WordPress メンテナンス中のため、ビルドを止めました"
          fi
      - name: Run build-c-columns
        if: steps.gate.outputs.skip != 'true'
        run: python3 tools/build-c-columns.py
      - name: Commit generated columns
        id: commit
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add column/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(columns): 週次再ビルド (WP CMS → static)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN での push は push トリガーのワークフロー（公開・IndexNow）を起動しない（GitHub の仕様）。
  # workflow_dispatch は GITHUB_TOKEN からでも起動できるので、実際に push したときだけ公開を起動する
  # （IndexNow への通知は static.yml が公開の成功後に行う）。ワークフローを起動できる権限（actions: write）は、
  # 外部（WordPress）のデータを扱うビルドのジョブには渡さず、このジョブだけに付ける。
  # main で動いたときだけ（別ブランチで試したときに main を公開しない）。
  dispatch:
    needs: build
    if: needs.build.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy (IndexNow is notified by static.yml after the deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run static.yml --ref main
