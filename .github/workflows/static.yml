# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  # 自動ビルド（GITHUB_TOKEN での push）は上の push を起動しないので、ビルド側が push の後に手動起動する
  # （build-c-columns.yml の dispatch ジョブ。本番のファイルを書き換える自動ビルドを足したら同じ手順を入れる）
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build service pages from data
        run: python3 tools/build-services.py
      - name: Check service data and generated pages
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_build_services.py'
      - name: Check shared CSS/JS load order and column input checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_asset_order.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_build_c_columns.py'
      - name: Collect public files only (no internal docs / scripts / tests)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_site_artifact.py'
          python3 tools/build-site-artifact.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 公開してよいファイルだけ（tools/build-site-artifact.py の許可リスト）。
          # 以前の path: '.' は内部資料まで https://contentsx.jp/ から取得できた（2026-10-14 修正）
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 公開が成功してから、前回デプロイしたコミットから今回までに変わった URL を IndexNow へ通知する
  # （先に送るとクローラーが 404 を受け取る。人の push・自動ビルドの起動のどちらでも同じ。
  #   待機中のデプロイが後の実行に置き換えられても、次の実行が前回デプロイからの差分をまとめて送る）
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit URLs changed since the previous deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          prev=""
          skipped_self=0
          for id_sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=20" --jq '.[] | "\(.id):\(.sha)"'); do
            state=$(gh api "repos/$REPO/deployments/${id_sha%%:*}/statuses" --jq '.[0].state')
            [ "$state" = "success" ] || continue
            if [ "${id_sha#*:}" = "$GITHUB_SHA" ] && [ "$skipped_self" = 0 ]; then skipped_self=1; continue; fi
            prev="${id_sha#*:}"
            break
          done
          echo "previous deployment: ${prev:-none}"
          python3 tools/indexnow-ping.py --base "${prev:-HEAD~1}" --head "$GITHUB_SHA"
