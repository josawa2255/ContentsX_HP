name: IndexNow Ping

# main への push 時に変更URLを IndexNow へ送信し、Bing/Yandex/Seznam のクロールを即トリガー。

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'llms.txt'
  # 自動ビルドの push では上の push が起動しないため、ビルドから手動起動される（build-c-columns.yml）
  workflow_dispatch:
    inputs:
      sha:
        description: 通知する変更のコミット（そのコミットと1つ前の差分を送る。空なら main の先頭）
        required: false
        type: string

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 2

      - name: Submit changed URLs to IndexNow
        run: python3 tools/indexnow-ping.py
