    .news-detail-back {
      display: inline-flex;

    }
    .news-detail-back:hover {

    }
    .news-detail-meta {

      margin-bottom: 20px;
    }
    .news-detail-date {
      font-size: 14px;

      color: var(--accent);
    }
    .news-detail-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      background: var(--bg-light);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 3px;
    }
    .news-detail-title {
      font-size: clamp(22px, 3.5vw, 32px);
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .news-detail-content {
      font-size: 15px;
      line-height: 1.9;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      padding-top: 32px;
    }
    .news-detail-content p {
      margin-bottom: 1.2em;
    }
    .news-detail-content a {
      color: var(--accent);
      text-decoration: underline;
    }
    .news-detail-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 16px 0;
    }
    .news-detail-loading {
      text-align: center;
      padding: 60px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .news-detail-error {
      text-align: center;
      padding: 60px 0;
    }
    .news-detail-error p {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 20px;
    }

  <script src="js/wp-config.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const newsId = params.get('id');

      const loadingEl  = document.getElementById('newsDetailLoading');
      const errorEl    = document.getElementById('newsDetailError');
      const articleEl  = document.getElementById('newsDetailArticle');

      if (!newsId) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        return;
      }

      try {
        const apiBase = (typeof WP_CONFIG !== 'undefined' && WP_CONFIG.enabled && WP_CONFIG.apiBase)
          ? WP_CONFIG.apiBase.replace(/\/+$/, '')
          : 'https://cms.contentsx.jp/wp-json/contentsx/v1';

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);

        const res = await fetch(`${apiBase}/news/${newsId}`, { signal: controller.signal });
        clearTimeout(timeout);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        /* ページタイトル更新 */
        const lang = document.documentElement.lang || 'ja';
        const title = lang === 'en' ? (data.title_en || data.title_ja) : data.title_ja;
        document.title = `${title} | ContentsX`;

        /* SEO: canonical/OG/description を記事ごとに動的更新 */
        const articleUrl = `https://contentsx.jp/news-detail?id=${encodeURIComponent(newsId)}`;
        const plainText = (data.content || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        const descText = plainText.slice(0, 120) || `${title} | ContentsXのニュース詳細`;
        const setMeta = (sel, attr, val) => {
          const el = document.querySelector(sel);
          if (el) el.setAttribute(attr, val);
        };
        setMeta('link[rel="canonical"]', 'href', articleUrl);
        setMeta('meta[name="description"]', 'content', descText);
        setMeta('meta[property="og:url"]', 'content', articleUrl);
        setMeta('meta[property="og:title"]', 'content', `${title} | ContentsX`);
        setMeta('meta[property="og:description"]', 'content', descText);
        setMeta('meta[property="og:type"]', 'content', 'article');
        setMeta('meta[name="twitter:title"]', 'content', `${title} | ContentsX`);
        setMeta('meta[name="twitter:description"]', 'content', descText);

        /* JSON-LD NewsArticle を動的更新（静的フォールバックを上書き） */
        const staticLd = document.getElementById('newsArticleSchema');
        if (staticLd) staticLd.remove();
        const existingLd = document.getElementById('news-article-ld');
        if (existingLd) existingLd.remove();
        const articleImage = data.thumbnail || data.image || 'https://contentsx.jp/material/images/og/og-news.webp';
        const pubDate = (data.date || '').replace(/\./g, '-');
        const ldScript = document.createElement('script');
        ldScript.type = 'application/ld+json';
        ldScript.id = 'news-article-ld';
        ldScript.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "NewsArticle",
          "headline": title,
          "description": descText,
          "url": articleUrl,
          "image": [articleImage],
          "datePublished": pubDate,
          "dateModified": pubDate,
          "author": {
            "@type": "Organization",
            "@id": "https://contentsx.jp/#organization",
            "name": "ContentsX",
            "url": "https://contentsx.jp"
          },
          "publisher": {
            "@type": "Organization",
            "@id": "https://contentsx.jp/#organization",
            "name": "ContentsX",
            "logo": {
              "@type": "ImageObject",
              "url": "https://contentsx.jp/material/images/logo/ContentsX.webp",
              "width": 180,
              "height": 36
            }
          },
          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": articleUrl
          }
        });
        document.head.appendChild(ldScript);

        /* データ反映 */
        document.getElementById('newsDate').textContent = data.date;

        const tagEl = document.getElementById('newsTag');
        tagEl.textContent = lang === 'en' ? (data.tag_en || data.tag_ja) : data.tag_ja;
        tagEl.setAttribute('data-ja', data.tag_ja || '');
        tagEl.setAttribute('data-en', data.tag_en || data.tag_ja || '');

        const titleEl = document.getElementById('newsTitle');
        titleEl.textContent = title;
        titleEl.setAttribute('data-ja', data.title_ja || '');
        titleEl.setAttribute('data-en', data.title_en || data.title_ja || '');

        /* XSS対策: WordPress APIからのHTMLをサニタイズ */
        var rawContent = data.content || '<p>詳細情報はありません。</p>';
        var contentEl = document.getElementById('newsContent');
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = rawContent;
        tempDiv.querySelectorAll('script,iframe,object,embed,base,form,meta,link,style,svg,math,noscript,template').forEach(function(el) { el.remove(); });
        tempDiv.querySelectorAll('*').forEach(function(el) {
          Array.from(el.attributes).forEach(function(attr) {
            if (attr.name.startsWith('on') || attr.value.trim().toLowerCase().replace(/[\t\n\r]/g,'').startsWith('javascript:') || attr.value.trim().toLowerCase().replace(/[\t\n\r]/g,'').startsWith('data:text/html')) {
              el.removeAttribute(attr.name);
            }
          });
        });
        contentEl.innerHTML = tempDiv.innerHTML;

        loadingEl.style.display = 'none';
        articleEl.style.display = 'block';

      } catch (e) {
        console.warn('[News Detail] Failed:', e.message);
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
      }
    });
  </script>

<script>
  /* HubSpot 遅延ロード: 初回ユーザー操作 or 4秒経過で読込 */
  (function(){
    var loaded = false;
    function loadHS(){
      if (loaded) return; loaded = true;
      var s = document.createElement('script');
      s.id = 'hs-script-loader';
      s.async = true;
      s.defer = true;
      s.src = '//js-na2.hs-scripts.com/48367061.js';
      document.head.appendChild(s);
      ['scroll','mousemove','touchstart','keydown','click'].forEach(function(ev){
        window.removeEventListener(ev, loadHS, {passive:true});
      });
    }
    ['scroll','mousemove','touchstart','keydown','click'].forEach(function(ev){
      window.addEventListener(ev, loadHS, {passive:true, once:true});
    });
    setTimeout(loadHS, 4000);
  })();
  </script>
