<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ニュース | ContentsX</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/webp" href="material/images/contentsx-icon.webp">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/dl-modal.css">
  <style>
    .news-detail-section {
      padding-top: 140px;
      padding-bottom: 80px;
      min-height: 60vh;
    }
    .news-detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 32px;
      transition: opacity 0.3s;
    }
    .news-detail-back:hover {
      opacity: 0.7;
    }
    .news-detail-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .news-detail-date {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }
    .news-detail-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      background: var(--bg-light);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 3px;
    }
    .news-detail-title {
      font-size: clamp(22px, 3.5vw, 32px);
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .news-detail-content {
      font-size: 15px;
      line-height: 1.9;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      padding-top: 32px;
    }
    .news-detail-content p {
      margin-bottom: 1.2em;
    }
    .news-detail-content a {
      color: var(--accent);
      text-decoration: underline;
    }
    .news-detail-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 16px 0;
    }
    .news-detail-loading {
      text-align: center;
      padding: 60px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .news-detail-error {
      text-align: center;
      padding: 60px 0;
    }
    .news-detail-error p {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body data-theme="cyber-green">

  <!-- ===== ヘッダー ===== -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="material/images/logo/ContentsX.webp" alt="ContentsX" class="logo-img">
      </a>
      <nav class="nav" id="nav"><!-- nav.js が生成 --></nav>
      <div class="header-right">
        <button class="hamburger" id="hamburger" aria-label="メニュー">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== ニュース詳細 ===== -->
  <section class="news-detail-section" id="newsDetail">
    <div class="container">
      <a href="index.html#news" class="news-detail-back" data-ja="← ニュース一覧に戻る" data-en="← Back to News">← ニュース一覧に戻る</a>

      <div id="newsDetailLoading" class="news-detail-loading">読み込み中...</div>

      <div id="newsDetailError" class="news-detail-error" style="display:none;">
        <p data-ja="ニュースが見つかりませんでした。" data-en="News article not found.">ニュースが見つかりませんでした。</p>
        <a href="index.html#news" class="news-detail-back" data-ja="ニュース一覧へ" data-en="Go to News">ニュース一覧へ</a>
      </div>

      <article id="newsDetailArticle" style="display:none;">
        <div class="news-detail-meta">
          <time class="news-detail-date" id="newsDate"></time>
          <span class="news-detail-tag" id="newsTag"></span>
        </div>
        <h1 class="news-detail-title" id="newsTitle"></h1>
        <div class="news-detail-content" id="newsContent"></div>
      </article>
    </div>
  </section>

  <!-- ===== フッター ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <img src="material/images/logo/ContentsX.webp" alt="ContentsX" class="logo-img">
          <p class="footer-company" data-ja="コンテンツエックス株式会社" data-en="Contents X Co., Ltd.">コンテンツエックス株式会社</p>
          <p class="footer-address" data-ja="東京都目黒区目黒2-11-15 8階" data-en="8F, 2-11-15 Meguro, Meguro-ku, Tokyo, Japan">東京都目黒区目黒2-11-15 8階</p>
        </div>
        <div class="footer-links">
          <a href="index.html#new-works" data-ja="新作情報" data-en="Latest Works">新作情報</a>
          <a href="index.html#about" data-ja="サービス" data-en="Services">サービス</a>
          <a href="index.html#strength" data-ja="制作体制" data-en="Production">制作体制</a>
          <a href="index.html#flow" data-ja="制作フロー" data-en="Workflow">制作フロー</a>
          <a href="partners.html" data-ja="パートナー" data-en="Partners">パートナー</a>
          <a href="company.html" data-ja="会社概要" data-en="Company">会社概要</a>
          <a href="contact.html" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a>
        </div>
      </div>
      <p class="footer-copy">© Contents X Co., Ltd. 2026 All rights reserved.</p>
    </div>
  </footer>

  <script src="js/nav.js" defer></script>
  <script src="js/wp-config.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const newsId = params.get('id');

      const loadingEl  = document.getElementById('newsDetailLoading');
      const errorEl    = document.getElementById('newsDetailError');
      const articleEl  = document.getElementById('newsDetailArticle');

      if (!newsId) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        return;
      }

      try {
        const apiBase = (typeof WP_CONFIG !== 'undefined' && WP_CONFIG.enabled && WP_CONFIG.apiBase)
          ? WP_CONFIG.apiBase.replace(/\/+$/, '')
          : 'https://bizmanga.contentsx.jp/wp-json/contentsx/v1';

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);

        const res = await fetch(`${apiBase}/news/${newsId}`, { signal: controller.signal });
        clearTimeout(timeout);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        /* ページタイトル更新 */
        const lang = document.documentElement.lang || 'ja';
        const title = lang === 'en' ? (data.title_en || data.title_ja) : data.title_ja;
        document.title = `${title} | ContentsX`;

        /* データ反映 */
        document.getElementById('newsDate').textContent = data.date;

        const tagEl = document.getElementById('newsTag');
        tagEl.textContent = lang === 'en' ? (data.tag_en || data.tag_ja) : data.tag_ja;
        tagEl.setAttribute('data-ja', data.tag_ja || '');
        tagEl.setAttribute('data-en', data.tag_en || data.tag_ja || '');

        const titleEl = document.getElementById('newsTitle');
        titleEl.textContent = title;
        titleEl.setAttribute('data-ja', data.title_ja || '');
        titleEl.setAttribute('data-en', data.title_en || data.title_ja || '');

        document.getElementById('newsContent').innerHTML = data.content || '<p>詳細情報はありません。</p>';

        loadingEl.style.display = 'none';
        articleEl.style.display = 'block';

      } catch (e) {
        console.warn('[News Detail] Failed:', e.message);
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
      }
    });
  </script>
  <script src="js/script.js" defer></script>
  <script src="js/dl-modal.js" defer></script>
<!-- Start of HubSpot Embed Code -->
<script type="text/javascript" id="hs-script-loader" async defer src="//js-na2.hs-scripts.com/48367061.js"></script>
<!-- End of HubSpot Embed Code -->
</body>
</html>
