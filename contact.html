  <!-- ===== メインコンテンツ ===== -->
  <div class="contact-main">
    <!-- 左：フォーム -->
    <div class="contact-form-section">
      <h1 data-ja="お問い合わせフォーム" data-en="Contact Form">お問い合わせフォーム</h1>
      <p data-ja="以下のフォームにご記入の上、送信してください。2営業日以内にご返信いたします。" data-en="Please fill in the form below. We will reply within 2 business days.">以下のフォームにご記入の上、送信してください。2営業日以内にご返信いたします。</p>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label class="form-label" for="company"><span data-ja="会社名" data-en="Company">会社名</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <input class="form-input" type="text" id="company" name="company" placeholder="コンテンツエックス株式会社" data-ph-ja="コンテンツエックス株式会社" data-ph-en="Contents X Co., Ltd." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="department"><span data-ja="部署" data-en="Department">部署</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <input class="form-input" type="text" id="department" name="department" placeholder="マーケティング部" data-ph-ja="マーケティング部" data-ph-en="Marketing Dept." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="fullName"><span data-ja="名前" data-en="Name">名前</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <input class="form-input" type="text" id="fullName" name="fullName" placeholder="佐藤 太郎" data-ph-ja="佐藤 太郎" data-ph-en="Taro Sato" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email"><span data-ja="メールアドレス" data-en="Email">メールアドレス</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <input class="form-input" type="email" id="email" name="email" placeholder="example@company.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="message"><span data-ja="お問い合わせ内容" data-en="Message">お問い合わせ内容</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <textarea class="form-textarea" id="message" name="message" placeholder="ご質問やご要望をご記入ください" data-ph-ja="ご質問やご要望をご記入ください" data-ph-en="Please describe your inquiry" required></textarea>
        </div>

        <button type="submit" class="delivery-btn delivery-btn--cx form-submit" aria-label="送信する">
          <span class="db-bg" aria-hidden="true"></span>
          <span class="db-car" aria-hidden="true">
            <span class="db-car-body"></span>
            <span class="db-car-top"></span>
            <span class="db-car-light"></span>
            <span class="db-car-wheel db-car-wheel--1"></span>
            <span class="db-car-wheel db-car-wheel--2"></span>
          </span>
          <span class="db-package" aria-hidden="true">
            <span class="db-package-flap db-package-flap--l"></span>
            <span class="db-package-flap db-package-flap--r"></span>
            <span class="db-package-stamp"></span>
          </span>
          <span class="db-text db-text--order" data-ja="送信する" data-en="Send Message">送信する</span>
          <span class="db-text db-text--done" data-ja="送信完了!" data-en="Sent!">送信完了!</span>
        </button>
      </form>
    </div>

  </div>
