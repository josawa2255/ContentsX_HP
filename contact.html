<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | ContentsX</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/webp" href="material/images/contentsx-icon.webp">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body data-theme="cyber-green">

  <!-- ===== ヘッダー ===== -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="material/images/logo/ContentsX.webp" alt="ContentsX" class="logo-img">
      </a>
      <nav class="nav" id="nav"><!-- nav.js が生成 --></nav>
      <div class="header-right">
        <button class="hamburger" id="hamburger" aria-label="メニュー">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>


  <!-- ===== メインコンテンツ ===== -->
  <div class="contact-main">
    <!-- 左：フォーム -->
    <div class="contact-form-section">
      <h2 data-ja="お問い合わせフォーム" data-en="Contact Form">お問い合わせフォーム</h2>
      <p data-ja="以下のフォームにご記入の上、送信してください。2営業日以内にご返信いたします。" data-en="Please fill in the form below. We will reply within 2 business days.">以下のフォームにご記入の上、送信してください。2営業日以内にご返信いたします。</p>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label class="form-label" for="company"><span data-ja="会社名" data-en="Company">会社名</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <input class="form-input" type="text" id="company" name="company" placeholder="コンテンツエックス株式会社" data-ph-ja="コンテンツエックス株式会社" data-ph-en="Contents X Co., Ltd." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="department"><span data-ja="部署" data-en="Department">部署</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <input class="form-input" type="text" id="department" name="department" placeholder="マーケティング部" data-ph-ja="マーケティング部" data-ph-en="Marketing Dept." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="fullName"><span data-ja="名前" data-en="Name">名前</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <input class="form-input" type="text" id="fullName" name="fullName" placeholder="佐藤 太郎" data-ph-ja="佐藤 太郎" data-ph-en="Taro Sato" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email"><span data-ja="メールアドレス" data-en="Email">メールアドレス</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <input class="form-input" type="email" id="email" name="email" placeholder="example@company.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="message"><span data-ja="お問い合わせ内容" data-en="Message">お問い合わせ内容</span> <span class="required" data-ja="必須" data-en="Required">必須</span></label>
          <textarea class="form-textarea" id="message" name="message" placeholder="ご質問やご要望をご記入ください" data-ph-ja="ご質問やご要望をご記入ください" data-ph-en="Please describe your inquiry" required></textarea>
        </div>

        <button type="submit" class="form-submit" data-ja="送信する" data-en="Send Message">送信する</button>
      </form>
    </div>

  </div>

  <!-- ===== フッター ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <img src="material/images/logo/ContentsX.webp" alt="ContentsX" class="logo-img">
          <p class="footer-company" data-ja="コンテンツエックス株式会社" data-en="Contents X Co., Ltd.">コンテンツエックス株式会社</p>
          <p class="footer-address" data-ja="東京都目黒区目黒2-11-15 8階" data-en="8F, 2-11-15 Meguro, Meguro-ku, Tokyo, Japan">東京都目黒区目黒2-11-15 8階</p>
        </div>
        <div class="footer-links">
          <a href="index.html#new-works" data-ja="新作情報" data-en="Latest Works">新作情報</a>
          <a href="index.html#about" data-ja="サービス" data-en="Services">サービス</a>
          <a href="index.html#strength" data-ja="制作体制" data-en="Production">制作体制</a>
          <a href="index.html#flow" data-ja="制作フロー" data-en="Workflow">制作フロー</a>
          <a href="partners.html" data-ja="パートナー" data-en="Partners">パートナー</a>
          <a href="company.html" data-ja="会社概要" data-en="Company">会社概要</a>
          <a href="contact.html" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a>
        </div>
      </div>
      <p class="footer-copy">© Contents X Co., Ltd. 2026 All rights reserved.</p>
    </div>
  </footer>

  <script src="js/nav.js" defer></script>
  <script src="js/contact.js" defer></script>

<script type="text/javascript" id="hs-script-loader" async defer src="//js-na2.hs-scripts.com/48367061.js"></script>
<!-- End of HubSpot Embed Code -->
</body>
</html>
