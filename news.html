<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    .news-page-section {
      padding-top: 140px;
      padding-bottom: 80px;
      min-height: 60vh;
    }
    .news-page-heading {
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 40px;
    }
    .news-page-loading {
      text-align: center;
      padding: 60px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }
  </style>
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "ホーム",
      "item": "https://contentsx.jp/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "ニュース",
      "item": "https://contentsx.jp/news"
    }
  ]
}
</script>
</head>
<body data-theme="magenta-hot" data-page-news>

  <!-- ===== ヘッダー ===== -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="./" class="logo">
        <img src="material/images/logo/ContentsX.webp" alt="ContentsX" class="logo-img">
      </a>
      <nav class="nav" id="nav"><!-- nav.js が生成 --></nav>
      <div class="header-right">
        <button class="hamburger" id="hamburger" aria-label="メニュー">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== ニュース一覧 ===== -->
  <section class="news-page-section">
    <div class="container">
      <h1 class="news-page-heading" data-ja="News" data-en="News">News</h1>
      <div id="newsPageLoading" class="news-page-loading" data-ja="読み込み中..." data-en="Loading...">読み込み中...</div>
      <ul class="news-list" style="display:none;"></ul>
    </div>
  </section>

  <!-- ===== フッター ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <img src="material/images/logo/ContentsX.webp" alt="ContentsX" class="logo-img">
          <p class="footer-company" data-ja="コンテンツエックス株式会社" data-en="Contents X Co., Ltd.">コンテンツエックス株式会社</p>
          <p class="footer-address" data-ja="東京都目黒区中目黒1-8-8 目黒F2ビル1F" data-en="1F Meguro F2 Building, 1-8-8 Nakameguro, Meguro-ku, Tokyo">東京都目黒区中目黒1-8-8 目黒F2ビル1F</p>
        </div>
        <div class="footer-links">
          <a href="./#new-works" data-ja="新作情報" data-en="Latest Works">新作情報</a>
          <a href="./#about" data-ja="サービス" data-en="Services">サービス</a>
          <a href="partners" data-ja="パートナー" data-en="Partners">パートナー</a>
          <a href="company" data-ja="会社概要" data-en="Company">会社概要</a>
          <a href="contact" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a>
          <a href="faq" data-ja="よくあるご質問" data-en="FAQ">よくあるご質問</a>
          <a href="privacy" data-ja="プライバシーポリシー" data-en="Privacy Policy">プライバシーポリシー</a>
          <a href="terms" data-ja="利用規約" data-en="Terms">利用規約</a>
        </div>
      </div>
      <p class="footer-copy">© Contents X Co., Ltd. 2026 All rights reserved.</p>
    </div>
  </footer>

  <script src="js/i18n.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/tracking.js" defer></script>
  <script src="js/wp-config.js" defer></script>
  <script src="js/wp-api.js" defer></script>
  <script src="js/script.js" defer></script>
  <script defer>
    window.addEventListener('wp-data-ready', function() {
      var loading = document.getElementById('newsPageLoading');
      var list = document.querySelector('.news-list');
      if (loading) loading.style.display = 'none';
      if (list) list.style.display = '';
    });
  </script>

<!-- JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "ニュース一覧 | ContentsX",
  "description": "ContentsXの最新ニュース・プレスリリース一覧。新サービス発表、制作実績、イベント登壇、採用情報、メディア掲載など、会社の最新動向をお届けします。",
  "url": "https://contentsx.jp/news",
  "publisher": {
    "@type": "Organization",
    "name": "ContentsX",
    "logo": {
      "@type": "ImageObject",
      "url": "https://contentsx.jp/material/images/logo/ContentsX.webp"
    }
  }
}
</script>
</body>
</html>
